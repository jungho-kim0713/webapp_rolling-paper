<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 롤링페이퍼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .font-cute { font-family: 'Jua', sans-serif; }

    /* 4가지 선택형 테두리 디자인 */
    .border-solid-gold {
      border: 4px solid #F59E0B;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    }
    .border-dashed-cute {
      border: 4px dashed #EC4899;
    }
    .border-double-retro {
      border: 6px double #4F46E5;
    }
    .border-neon-glow {
      border: 2px solid #10B981;
      box-shadow: 0 0 12px #10B981, inset 0 0 8px #10B981;
    }

    /* 동그란 메시지 카드 공통 스타일 */
    .paper-bubble {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .paper-bubble:hover {
      transform: translate(-50%, -50%) scale(1.2) !important;
      z-index: 50 !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- 상단 헤더 & 친구 선택 탭 -->
  <header class="bg-white shadow-sm sticky top-0 z-40 px-4 py-3">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-2xl">💌</span>
        <h1 class="text-xl font-bold text-slate-800 font-cute tracking-wide">우리 반 롤링페이퍼</h1>
      </div>

      <!-- 친구 이름 목록 버튼들 -->
      <div id="recipient-tabs" class="flex items-center gap-2 overflow-x-auto py-1 max-w-full">
        <span class="text-sm text-slate-400">데이터 불러오는 중...</span>
      </div>

      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm transition">
        + 롤링페이퍼 쓰기
      </button>
    </div>
  </header>

  <!-- 메인 롤링페이퍼 원형 캔버스 영역 -->
  <main class="flex-1 overflow-auto relative flex items-center justify-center p-4">
    <div id="canvas-area" class="relative w-[950px] h-[950px] shrink-0 rounded-full bg- radial from-indigo-50/60 to-transparent">
      
      <!-- 정중앙 주인공 배지 -->
      <div id="center-badge" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-44 h-44 rounded-full bg-gradient-to-br from-indigo-600 to-purple-600 text-white flex flex-col items-center justify-center shadow-2xl z-30 border-4 border-white text-center p-4">
        <span class="text-xs uppercase tracking-widest opacity-80 mb-1">To. 주인공</span>
        <h2 id="current-recipient-name" class="text-2xl font-cute leading-tight break-keep">친구를<br>선택하세요</h2>
        <span id="message-count" class="mt-2 text-xs bg-white/20 px-2.5 py-0.5 rounded-full">0개의 마음</span>
      </div>

      <!-- 주변 동그란 카드들이 여기에 동적으로 배치됨 -->
      <div id="bubbles-container"></div>
    </div>
  </main>

  <!-- 메시지 작성 모달 -->
  <div id="write-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800">마음 남기기 ✏️</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
      </div>

      <form id="message-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">받는 친구 이름</label>
          <input type="text" id="input-recipient" required placeholder="예: 김이안" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">내 이름 (또는 별명)</label>
          <input type="text" id="input-sender" required placeholder="예: 짝꿍" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">메시지 내용 (70자 이내 권장)</label>
          <textarea id="input-message" required maxlength="80" rows="3" placeholder="친구에게 따뜻한 한마디를 남겨줘!" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
        </div>

        <!-- 배경색 선택 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">동그라미 배경색</label>
          <div class="flex gap-3" id="color-options">
            <label class="cursor-pointer"><input type="radio" name="bg_color" value="#FEF08A" checked class="sr-only peer"><div class="w-8 h-8 rounded-full bg-[#FEF08A] border-2 border-transparent peer-checked:border-slate-800 peer-checked:scale-110 transition"></div></label>
            <label class="cursor-pointer"><input type="radio" name="bg_color" value="#FBCFE8" class="sr-only peer"><div class="w-8 h-8 rounded-full bg-[#FBCFE8] border-2 border-transparent peer-checked:border-slate-800 peer-checked:scale-110 transition"></div></label>
            <label class="cursor-pointer"><input type="radio" name="bg_color" value="#BAE6FD" class="sr-only peer"><div class="w-8 h-8 rounded-full bg-[#BAE6FD] border-2 border-transparent peer-checked:border-slate-800 peer-checked:scale-110 transition"></div></label>
            <label class="cursor-pointer"><input type="radio" name="bg_color" value="#BBF7D0" class="sr-only peer"><div class="w-8 h-8 rounded-full bg-[#BBF7D0] border-2 border-transparent peer-checked:border-slate-800 peer-checked:scale-110 transition"></div></label>
            <label class="cursor-pointer"><input type="radio" name="bg_color" value="#E9D5FF" class="sr-only peer"><div class="w-8 h-8 rounded-full bg-[#E9D5FF] border-2 border-transparent peer-checked:border-slate-800 peer-checked:scale-110 transition"></div></label>
          </div>
        </div>

        <!-- 테두리 스타일 선택 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">테두리 디자인</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="cursor-pointer">
              <input type="radio" name="border_style" value="border-solid-gold" checked class="sr-only peer">
              <div class="p-2 rounded-lg text-center border-solid-gold peer-checked:bg-amber-50 font-semibold">✨ 골드 실선</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="border_style" value="border-dashed-cute" class="sr-only peer">
              <div class="p-2 rounded-lg text-center border-dashed-cute peer-checked:bg-pink-50 font-semibold">🌸 귀여운 점선</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="border_style" value="border-double-retro" class="sr-only peer">
              <div class="p-2 rounded-lg text-center border-double-retro peer-checked:bg-indigo-50 font-semibold">🕹️ 레트로 이중선</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="border_style" value="border-neon-glow" class="sr-only peer">
              <div class="p-2 rounded-lg text-center border-neon-glow peer-checked:bg-emerald-50 font-semibold">💚 네온 글로우</div>
            </label>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl shadow transition">
          롤링페이퍼 붙이기
        </button>
      </form>
    </div>
  </div>

  <script>
    let currentRecipient = '';

    // 1. 서버에서 데이터 불러오기
    async function loadData(recipient = '') {
      try {
        const url = recipient ? `/api/messages?recipient=${encodeURIComponent(recipient)}` : '/api/messages';
        const res = await fetch(url);
        const data = await res.json();

        if (data.recipients && data.recipients.length > 0) {
          currentRecipient = recipient || data.recipients[0];
          renderTabs(data.recipients, currentRecipient);
          renderCanvas(currentRecipient, data.messages || []);
        } else {
          document.getElementById('recipient-tabs').innerHTML = '<span class="text-sm text-slate-400">아직 작성된 롤링페이퍼가 없어요! 첫 글을 남겨보세요.</span>';
          document.getElementById('current-recipient-name').innerHTML = '첫 주인공을<br>기다려요!';
          document.getElementById('message-count').innerText = '0개의 마음';
          document.getElementById('bubbles-container').innerHTML = '';
        }
      } catch (err) {
        console.error('데이터 로드 실패:', err);
      }
    }

    // 2. 상단 친구 이름 탭 렌더링
    function renderTabs(recipients, activeName) {
      const container = document.getElementById('recipient-tabs');
      container.innerHTML = recipients.map(name => {
        const isActive = name === activeName;
        return `
          <button onclick="loadData('${name}')" 
            class="px-3.5 py-1.5 rounded-full text-sm font-semibold transition shrink-0 ${
              isActive ? 'bg-slate-800 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
            }">
            🎉 ${name}
          </button>
        `;
      }).join('');
    }

    // 3. 중앙 이름 & 주변 원형 카드 배치 렌더링 (핵심 수학 로직!)
    function renderCanvas(recipient, messages) {
      document.getElementById('current-recipient-name').innerText = recipient;
      document.getElementById('message-count').innerText = `${messages.length}개의 마음`;

      const container = document.getElementById('bubbles-container');
      container.innerHTML = '';

      const centerX = 475; // 캔버스(950px)의 정중앙 X
      const centerY = 475; // 캔버스(950px)의 정중앙 Y

      // 안쪽 궤도부터 바깥쪽 궤도로 동그랗게 퍼져 나가도록 계산
      let ringIndex = 0;
      let indexInRing = 0;
      let maxInCurrentRing = 6; // 첫 번째 궤도에는 6개 배치

      messages.forEach((msg, idx) => {
        if (indexInRing >= maxInCurrentRing) {
          ringIndex++;
          indexInRing = 0;
          maxInCurrentRing = 6 + ringIndex * 4; // 바깥 궤도일수록 더 많은 원 배치 (6개 -> 10개 -> 14개)
        }

        // 반지름(중심으로부터의 거리)과 각도 계산
        const radius = 210 + ringIndex * 145;
        const angleStep = (2 * Math.PI) / maxInCurrentRing;
        // 궤도마다 시작 각도를 조금씩 틀어줘서 자연스러운 워드클라우드 느낌 연출
        const angle = indexInRing * angleStep + (ringIndex * 0.4);

        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        indexInRing++;

        const bubble = document.createElement('div');
        bubble.className = `paper-bubble absolute w-36 h-36 rounded-full flex flex-col items-center justify-center p-3 text-center cursor-pointer select-none ${msg.border_style}`;
        bubble.style.backgroundColor = msg.bg_color;
        bubble.style.left = `${x}px`;
        bubble.style.top = `${y}px`;
        bubble.style.transform = `translate(-50%, -50%) rotate(${(idx % 2 === 0 ? 1 : -1) * (idx % 5)}deg)`;
        bubble.style.zIndex = 10 + idx;

        bubble.innerHTML = `
          <p class="text-xs font-medium text-slate-800 break-keep line-clamp-4 leading-snug mb-1.5">${escapeHtml(msg.message)}</p>
          <span class="text-[11px] font-bold text-slate-600 bg-white/60 px-2 py-0.5 rounded-full">From. ${escapeHtml(msg.sender)}</span>
        `;

        container.appendChild(bubble);
      });
    }

    // XSS 방지용 간단한 이스케이프
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // 4. 모달 열기/닫기
    function openModal() {
      const modal = document.getElementById('write-modal');
      const recipientInput = document.getElementById('input-recipient');
      if (currentRecipient) recipientInput.value = currentRecipient;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('write-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 5. 새 메시지 저장 요청 (POST)
    document.getElementById('message-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = '붙이는 중...';

      const payload = {
        recipient: document.getElementById('input-recipient').value,
        sender: document.getElementById('input-sender').value,
        message: document.getElementById('input-message').value,
        bg_color: document.querySelector('input[name="bg_color"]:checked').value,
        border_style: document.querySelector('input[name="border_style"]:checked').value,
      };

      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          document.getElementById('input-message').value = '';
          closeModal();
          await loadData(payload.recipient); // 방금 쓴 친구의 롤링페이퍼 화면으로 즉시 갱신
        } else {
          alert('저장에 실패했어요.');
        }
      } catch (err) {
        alert('오류가 발생했습니다.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '롤링페이퍼 붙이기';
      }
    });

    // 첫 화면 로드 실행
    loadData();
  </script>
</body>
</html>
